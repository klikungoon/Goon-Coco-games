<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel Hunter</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,500&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500&display=swap">
<style>
:root{--bg:#ebe6da;--ink:#1b1915;--mu:#7a7468;--ln:#1b1915;--ac:#d9432a;--pn:#e3ddcf;
--serif:Fraunces,Georgia,serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--sans:Inter,system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15130f;--ink:#ece6d8;--mu:#8c8575;--ln:#ece6d8;--pn:#1e1b16}}
:root[data-theme="dark"]{--bg:#15130f;--ink:#ece6d8;--mu:#8c8575;--ln:#ece6d8;--pn:#1e1b16}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans)}
.app{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;max-width:1120px;margin:0 auto;padding:24px 20px 40px}
@media(max-width:880px){.app{grid-template-columns:1fr;gap:20px}}
h1{font:italic 600 34px/1 var(--serif);margin:0 0 4px;letter-spacing:-.5px}
.sub{color:var(--mu);font-size:13px;margin:0 0 20px}
#wrap{border:1.5px solid var(--ln);overflow:auto;max-height:78vh;background:var(--pn);touch-action:pan-x pan-y pinch-zoom}
canvas.main{display:block;image-rendering:pixelated;cursor:crosshair}
.cap{display:flex;justify-content:space-between;font:12px var(--mono);color:var(--mu);margin-top:8px;gap:8px}
aside h3{font:600 11px var(--mono);letter-spacing:1.5px;text-transform:uppercase;color:var(--mu);margin:0 0 8px;font-weight:400}
.sec{border-top:1.5px solid var(--ln);padding:14px 0 18px}
.lv button{display:flex;justify-content:space-between;width:100%;padding:10px 0;background:none;border:0;border-bottom:1px solid color-mix(in srgb,var(--ln) 20%,transparent);font:500 17px var(--serif);color:var(--ink);cursor:pointer;text-align:left}
.lv button span{font:13px var(--mono);color:var(--mu)}
.lv button.on{color:var(--ac)}.lv button.on::before{content:"→ ";}
.lv button.on span{color:var(--ac)}
.big{display:flex;gap:22px}
.big div{font:11px var(--mono);color:var(--mu);text-transform:uppercase;letter-spacing:1px}
.big b{display:block;font:600 34px/1.1 var(--mono);color:var(--ink);letter-spacing:-1px;text-transform:none}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{font:13px var(--mono);padding:7px 11px;border:1.5px solid var(--ln);background:none;color:var(--ink);cursor:pointer;border-radius:0}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gal button{padding:0;border:1.5px solid transparent;background:none;cursor:pointer;text-align:left;color:var(--ink);font:11px var(--mono)}
.gal button canvas{display:block;width:100%;height:auto;outline:1px solid color-mix(in srgb,var(--ln) 25%,transparent)}
.gal button.on{border-color:var(--ac)}
.gal button.on canvas{outline:none}
.gal button span{display:block;margin-top:3px;color:var(--mu)}
.up{display:flex;align-items:center;justify-content:center;aspect-ratio:1.25;border:1.5px dashed var(--mu);font:12px var(--mono);color:var(--mu);cursor:pointer;text-align:center;padding:4px}
.up:hover{border-color:var(--ac);color:var(--ac)}
#status{min-height:44px;font:italic 500 19px/1.25 var(--serif);color:var(--ac)}
</style>
</head>
<body>
<div class="app">
<main>
 <h1>Pixel Hunter</h1>
 <p class="sub">На картине спрятан один пиксель чуть другого оттенка. Найди его.</p>
 <div id="wrap"><canvas id="cv" class="main"></canvas></div>
 <div class="cap"><span id="figc"></span><span id="grid"></span></div>
</main>
<aside>
 <div class="sec" style="border-top:0;padding-top:0">
  <h3>Сложность</h3>
  <div class="lv" id="levels">
   <button data-l="0" class="on">Лёгкий<span>500 px</span></button>
   <button data-l="1">Средний<span>2 500 px</span></button>
   <button data-l="2">Сложный<span>10 000 px</span></button>
  </div>
 </div>
 <div class="sec">
  <div class="big"><div>Время<b id="time">0.0</b></div><div>Промахи<b id="miss">0</b></div><div>Рекорд<b id="best">—</b></div></div>
  <div class="btns"><button class="btn" id="hint">Подсказка +5с</button><button class="btn" id="zout">−</button><button class="btn" id="zl" disabled>×1</button><button class="btn" id="zin">+</button></div>
  <div id="status" style="margin-top:14px"></div>
 </div>
 <div class="sec">
  <h3>Картина</h3>
  <div class="gal" id="gal"></div>
  <input id="file" type="file" accept="image/*" hidden>
 </div>
</aside>
</div>

<script>
const $=id=>document.getElementById(id);
const LV=[{n:500,d:46,blink:true},{n:2500,d:24},{n:10000,d:12}];
function mb(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function sky(g,w,h,st,y1=1){const l=g.createLinearGradient(0,0,0,h*y1);st.forEach((c,i)=>l.addColorStop(i/(st.length-1),c));g.fillStyle=l;g.fillRect(0,0,w,h)}
function glow(g,x,y,r,c){const q=g.createRadialGradient(x,y,0,x,y,r);q.addColorStop(0,c);q.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=q;g.fillRect(x-r,y-r,r*2,r*2)}
function disc(g,x,y,r,c){g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
function ridge(g,w,h,base,amp,col,r,f){const p=[r()*6,r()*6,r()*6];g.fillStyle=col;g.beginPath();g.moveTo(0,h);
 for(let x=0;x<=w;x+=w/200){const u=x/w*f;g.lineTo(x,h*base+h*amp*(Math.sin(u+p[0])+.5*Math.sin(u*2.3+p[1])+.22*Math.sin(u*5.1+p[2])))}
 g.lineTo(w,h);g.fill()}
function fog(g,w,h,a,c='235,240,230'){g.fillStyle=`rgba(${c},${a})`;g.fillRect(0,0,w,h)}
const SC=[
{n:'Закат',d(g,w,h,r){sky(g,w,h,['#34345f','#c45a7b','#f3a45f','#fbd58a'],.8);glow(g,w*.5,h*.56,h*.5,'rgba(255,225,170,.75)');disc(g,w*.5,h*.56,h*.085,'#fff0c4');
 [['#b4607a',.6],['#8a4a6d',.68],['#5b3b5e',.77],['#2c2344',.87]].forEach(([c,b],i)=>ridge(g,w,h,b,.05-i*.006,c,r,5+i*2))}},
{n:'Ночь',d(g,w,h,r){sky(g,w,h,['#04061a','#142250','#2a3d78']);for(let i=0;i<220;i++){g.fillStyle=`rgba(255,255,240,${.2+r()*.7})`;const s=r()<.1?2.2:1.2;g.fillRect(r()*w,r()*h*.62,s*w/800,s*w/800)}
 const mx=w*.7,my=h*.22;glow(g,mx,my,h*.3,'rgba(220,230,255,.45)');disc(g,mx,my,h*.06,'#f4f1dd');
 ridge(g,w,h,.64,.05,'#0a1230',r,6);const l=g.createLinearGradient(0,h*.7,0,h);l.addColorStop(0,'#1a2858');l.addColorStop(1,'#050816');g.fillStyle=l;g.fillRect(0,h*.7,w,h*.3);
 for(let i=0;i<26;i++){g.fillStyle=`rgba(235,240,255,${.55-i*.02})`;const ww=h*.12*(1-i/32)*(.5+r()*.8);g.fillRect(mx-ww/2,h*.72+i*h*.011,ww,h*.004)}
 ridge(g,w,h,.74,.008,'#04060f',r,14);g.fillStyle='#050816';g.fillRect(0,h*.75,w,h*.25);
 const l2=g.createLinearGradient(0,h*.74,0,h);l2.addColorStop(0,'#16235a');l2.addColorStop(1,'#050816');g.fillStyle=l2;g.fillRect(0,h*.76,w,h*.24)}},
{n:'Пустыня',d(g,w,h,r){sky(g,w,h,['#f3c98e','#fae2b8','#fdf0d6'],.7);glow(g,w*.7,h*.3,h*.4,'rgba(255,200,140,.6)');disc(g,w*.7,h*.3,h*.1,'#e4573a');
 [['#e9b070',.58],['#d08a4e',.67],['#b06638',.77],['#7a4326',.88]].forEach(([c,b],i)=>ridge(g,w,h,b,.035,c,r,2.5+i))}},
{n:'Город',d(g,w,h,r){sky(g,w,h,['#1b2147','#7a4a8a','#ee7a8c','#ffc684']);disc(g,w*.25,h*.45,h*.07,'#ffe7b8');
 [['#4a3866',.55,.3],['#2c2249',.65,.38],['#150f2b',.78,.5]].forEach(([c,b,mx],L)=>{g.fillStyle=c;let x=-10;while(x<w){const bw=w*(.04+r()*.06),bh=h*(.12+r()*mx);g.fillRect(x,h*b+h*.12-bh+(L*h*.04),bw,h);
  if(L>0){for(let wy=h*b+h*.14-bh+L*h*.04;wy<h*.95;wy+=h*.03)for(let wx=x+bw*.12;wx<x+bw*.85;wx+=w*.014)if(r()<.35){g.fillStyle=r()<.8?'#ffd88a':'#9fd8ff';g.fillRect(wx,wy,w*.007,h*.014)}g.fillStyle=c}x+=bw+w*.003}})}},
{n:'Лес',d(g,w,h,r){sky(g,w,h,['#cfe0cf','#e9efdf']);glow(g,w*.3,h*.25,h*.35,'rgba(255,248,210,.8)');
 ['#a6bf9f','#78a07b','#4d7a58','#27503c','#12301f'].forEach((c,i)=>{fog(g,w,h,.28);const by=h*(.5+i*.1);g.fillStyle=c;g.fillRect(0,by+h*.05,w,h);
  for(let x=-20;x<w+20;x+=w*(.03-i*.003)*(.6+r()*.8)){const th=h*(.1+r()*.12)*(1+i*.35),tw=th*.32;g.beginPath();g.moveTo(x,by-th);g.lineTo(x+tw,by+h*.05);g.lineTo(x-tw,by+h*.05);g.fill()}})}},
{n:'Баухаус',d(g,w,h,r){g.fillStyle='#ecdfc2';g.fillRect(0,0,w,h);
 disc(g,w*.36,h*.52,h*.32,'#d8402a');g.fillStyle='#1f3a6e';g.fillRect(w*.5,h*.1,w*.26,h*.62);
 g.fillStyle='#f2b632';g.beginPath();g.arc(w*.62,h*.72,h*.2,Math.PI,0);g.fill();
 g.fillStyle='#2f6b5a';g.beginPath();g.moveTo(w*.12,h*.9);g.lineTo(w*.3,h*.55);g.lineTo(w*.46,h*.9);g.fill();
 g.fillStyle='#16140f';g.fillRect(w*.08,h*.12,w*.3,h*.012);g.fillRect(w*.78,h*.1,w*.012,h*.8);disc(g,w*.86,h*.28,h*.07,'#16140f');disc(g,w*.36,h*.52,h*.1,'#ecdfc2')}}
];
const cv=$('cv'),ctx=cv.getContext('2d');
let lvl=0,sc=0,src=null,cols,rows,small,sctx,tx,ty,orig,mod,start,pen=0,miss=0,run=false,tm,bl,zoom=1,hintC,flash,showMod=true;
const ASP=1.25;
function renderScene(i,w,h,seed){const c=document.createElement('canvas');c.width=w;c.height=h;SC[i].d(c.getContext('2d'),w,h,mb(seed));return c}
function buildGal(){const G=$('gal');G.innerHTML='';
 SC.forEach((s,i)=>{const b=document.createElement('button');b.dataset.i=i;if(!src&&i===sc)b.classList.add('on');
  b.appendChild(renderScene(i,150,120,i*7+3));const sp=document.createElement('span');sp.textContent=s.n;b.appendChild(sp);
  b.onclick=()=>{src=null;sc=i;buildGal();newRound()};G.appendChild(b)});
 const u=document.createElement('div');u.className='up';u.textContent=src?'✓ своя картинка':'+ своя картинка';u.onclick=()=>$('file').click();G.appendChild(u)}
function dims(a){const n=LV[lvl].n,c=Math.max(2,Math.round(Math.sqrt(n*a)));return[c,Math.max(2,Math.round(n/c))]}
function newRound(){
 clearInterval(tm);clearInterval(bl);$('status').textContent='';
 const a=src?src.width/src.height:ASP;[cols,rows]=dims(a);
 small=document.createElement('canvas');small.width=cols;small.height=rows;sctx=small.getContext('2d');
 const img=src||renderScene(sc,800,Math.round(800/ASP),(Math.random()*1e9)|0);
 const iw=img.width,ih=img.height,ar=cols/rows;let sw=iw,sh=ih;if(iw/ih>ar)sw=ih*ar;else sh=iw/ar;
 sctx.imageSmoothingEnabled=true;sctx.imageSmoothingQuality='high';sctx.drawImage(img,(iw-sw)/2,(ih-sh)/2,sw,sh,0,0,cols,rows);
 tx=Math.floor(Math.random()*cols);ty=Math.floor(Math.random()*rows);
 const d=sctx.getImageData(tx,ty,1,1).data;orig=[d[0],d[1],d[2]];
 const k=LV[lvl].d*((d[0]*.3+d[1]*.59+d[2]*.11)>140?-1:1);mod=orig.map(v=>Math.max(0,Math.min(255,v+k)));
 pen=0;miss=0;hintC=null;flash=null;showMod=true;run=true;start=performance.now();$('miss').textContent=0;
 $('figc').textContent='Рис. — '+(src?'Своя картинка':SC[sc].n);$('grid').textContent=cols+' × '+rows+' = '+(cols*rows)+' px';
 sizeCanvas();paint();
 tm=setInterval(()=>$('time').textContent=el().toFixed(1),100);
 if(LV[lvl].blink)bl=setInterval(()=>{showMod=!showMod;paint()},450)}
function el(){return(performance.now()-start)/1000+pen}
function sizeCanvas(){const w=Math.min($('wrap').clientWidth-3,760),W=Math.round(w*zoom),H=Math.round(W*rows/cols);cv.width=W;cv.height=H;cv.style.width=W+'px';cv.style.height=H+'px'}
function paint(){sctx.fillStyle=`rgb(${(showMod?mod:orig).join(',')})`;sctx.fillRect(tx,ty,1,1);
 ctx.imageSmoothingEnabled=false;ctx.drawImage(small,0,0,cv.width,cv.height);const cw=cv.width/cols;
 if(hintC){const R=Math.max(34,cv.width/7);ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.beginPath();ctx.arc(hintC.x*cw,hintC.y*cw,R,0,7);ctx.stroke();ctx.lineWidth=1;ctx.strokeStyle='#000';ctx.stroke()}
 if(flash){ctx.strokeStyle='#ff3b1f';ctx.lineWidth=2;ctx.strokeRect(flash.x*cw-2,flash.y*cw-2,cw+4,cw+4)}}
cv.addEventListener('click',e=>{if(!run)return;const r=cv.getBoundingClientRect();
 const x=Math.floor((e.clientX-r.left)/r.width*cols),y=Math.floor((e.clientY-r.top)/r.height*rows);
 if(x===tx&&y===ty)win();else{miss++;pen+=3;$('miss').textContent=miss;flash={x,y};paint();setTimeout(()=>{flash=null;paint()},350)}});
function key(){return'ph2-'+lvl+(src?'-img':'')}
function loadBest(){let b=null;try{b=parseFloat(localStorage.getItem(key()))}catch(e){}$('best').textContent=b?b.toFixed(1):'—'}
function win(){run=false;clearInterval(tm);clearInterval(bl);showMod=true;hintC=null;const t=el();$('time').textContent=t.toFixed(1);paint();
 const cw=cv.width/cols;ctx.strokeStyle='#22c55e';ctx.lineWidth=3;ctx.beginPath();ctx.arc((tx+.5)*cw,(ty+.5)*cw,Math.max(14,cw*2.2),0,7);ctx.stroke();
 let b=null;try{b=parseFloat(localStorage.getItem(key()))}catch(e){}let s=`Нашёл за ${t.toFixed(1)} с.`;
 if(!b||t<b){try{localStorage.setItem(key(),t)}catch(e){}s+=' Новый рекорд!'}
 const st=$('status');st.textContent=s+' ';const a=document.createElement('button');a.className='btn pri';a.textContent='Ещё раз';a.onclick=newRound;st.appendChild(document.createElement('br'));st.appendChild(a);loadBest()}
$('levels').onclick=e=>{const b=e.target.closest('button');if(!b)return;lvl=+b.dataset.l;[...$('levels').children].forEach(x=>x.classList.toggle('on',x===b));loadBest();newRound()};
$('hint').onclick=()=>{if(!run)return;pen+=5;hintC={x:tx+.5+(Math.random()-.5)*cols/6,y:ty+.5+(Math.random()-.5)*cols/6};paint()};
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{src=im;buildGal();loadBest();newRound()};im.src=URL.createObjectURL(f);e.target.value=''};
function setZoom(z){zoom=Math.max(1,Math.min(6,z));$('zl').textContent='×'+zoom;sizeCanvas();paint()}
$('zin').onclick=()=>setZoom(zoom+1);$('zout').onclick=()=>setZoom(zoom-1);
addEventListener('resize',()=>{sizeCanvas();paint()});
buildGal();loadBest();newRound();
</script>
</body>
</html>
