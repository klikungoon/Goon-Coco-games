<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мои игры</title>
<style>
:root{--bg:#fff8ec;--card:#fff;--text:#1d1b2e;--mut:#6d6a80;--line:#1d1b2e;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14121f;--card:#1f1c30;--text:#f4f1ff;--mut:#a29fbd;--line:#000}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
header{text-align:center;padding:48px 16px 20px}
h1{margin:0;font-size:clamp(34px,8vw,64px);letter-spacing:-.02em}
header p{color:var(--mut);margin:8px 0 20px;font-size:18px}
#q{width:min(420px,100%);padding:14px 18px;font-size:17px;border:3px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);outline:none}
#q:focus{box-shadow:0 0 0 4px #f5c45177}
main{max-width:1000px;margin:0 auto;padding:16px 16px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{position:relative;display:flex;flex-direction:column;gap:6px;padding:20px;text-decoration:none;color:inherit;background:var(--card);border:3px solid var(--line);border-radius:20px;box-shadow:6px 6px 0 var(--c,#f5c451);transition:transform .15s,box-shadow .15s}
.card:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--c,#f5c451)}
.card:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--c,#f5c451)}
.em{font-size:56px;line-height:1.1}
.card h2{margin:4px 0 0;font-size:22px}
.card p{margin:0;color:var(--mut);font-size:15px;line-height:1.4}
.new{position:absolute;top:12px;right:12px;background:var(--c,#f5c451);color:#1d1b2e;font-weight:800;font-size:12px;padding:3px 8px;border-radius:999px;border:2px solid var(--line)}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:30px;line-height:1.6}
</style>
</head>
<body>
<header>
  <h1>🎮 Мои игры</h1>
  <p>Выбери игру и играй</p>
  <input id="q" type="search" placeholder="Поиск игры…" autocomplete="off">
</header>
<main id="grid"></main>

<script>
var games=[];
var grid=document.getElementById('grid');

function show(list){
  grid.innerHTML='';
  if(!list.length){
    var e=document.createElement('div');e.className='empty';e.textContent='Ничего не найдено';grid.appendChild(e);return;
  }
  list.forEach(function(g){
    var a=document.createElement('a');
    a.className='card';a.href=g.path;
    a.style.setProperty('--c',g.color||'#f5c451');
    if(g.new){var n=document.createElement('span');n.className='new';n.textContent='НОВОЕ';a.appendChild(n)}
    var em=document.createElement('div');em.className='em';em.textContent=g.emoji||'🎲';
    var h=document.createElement('h2');h.textContent=g.title;
    var p=document.createElement('p');p.textContent=g.desc||'';
    a.appendChild(em);a.appendChild(h);a.appendChild(p);
    grid.appendChild(a);
  });
}

document.getElementById('q').addEventListener('input',function(e){
  var t=e.target.value.toLowerCase().trim();
  show(games.filter(function(g){return (g.title+' '+(g.desc||'')).toLowerCase().indexOf(t)>-1}));
});

fetch('games.json')
  .then(function(r){return r.json()})
  .then(function(list){games=list;show(games)})
  .catch(function(){
    grid.innerHTML='<div class="empty">Не получилось загрузить список игр (games.json).<br>Открывай сайт по ссылке с GitHub Pages — двойным кликом по файлу он не работает.</div>';
  });
</script>
</body>
</html>
